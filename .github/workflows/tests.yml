name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - codex/dev-release-20261022
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest voluptuous-serialize pytest-homeassistant-custom-component==0.13.373 unidecode custom_components/homeassistantedupage/_wheels/*.whl

      - name: Run tests
        run: pytest tests -v
